name: PR Checks

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools (Brewfile)
        run: |
          brew update
          brew bundle

      - name: Tuist generate
        run: tuist generate

      - name: SwiftLint
        run: swiftlint lint

      - name: Build & Test
        run: |
          xcodebuild \
            -workspace Pulse.xcworkspace \
            -scheme Pulse \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            test | xcbeautify
