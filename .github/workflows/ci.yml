name: CI

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: Install tools (mise)
        run: mise install

      - name: Install tools (Homebrew)
        run: brew bundle

      - name: Tuist generate
        run: tuist generate

      - name: SwiftLint
        run: swiftlint lint

      - name: Build & Test
        run: |
          xcodebuild \
            -workspace Pulse.xcworkspace \
            -scheme Pulse \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            test | xcbeautify
